# The production image on this machine: http://localhost:${HOST_PORT} (default 3000).
# Needs ADMIN_USERNAME and ADMIN_PASSWORD_HASH in .env. For a server behind
# Caddy use compose.prod.yaml instead (docs/deploy.md).
services:
  app:
    build: .
    ports:
      - '${HOST_PORT:-3000}:3000'
    volumes:
      - cocktail-db:/data
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATA_DIR: /data
      LOG_LEVEL: info
      # Required in production: create the hash with `npm run hash-password --workspace=server`.
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?set ADMIN_PASSWORD_HASH in .env}
      # Express serves the client too, so the site's origin is this host and port.
      # Every login and change must come from it, so it follows HOST_PORT.
      CLIENT_ORIGIN: http://localhost:${HOST_PORT:-3000}
    restart: unless-stopped

volumes:
  cocktail-db:
