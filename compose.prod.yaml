# Production: the app behind the owner's existing Caddy. See docs/deploy.md.
# Hardened (read-only, no capabilities, resource limits). Limits measured on a
# throwaway stack (peak 80 MB memory, 1.1 CPU in a flood, 23 processes; see "Measured"
# in docs/superpowers/specs/2026-11-04-compose-hardening-design.md).
#
#   docker compose -f compose.prod.yaml up -d --build
#
# No ports are published: Caddy reaches the container over the shared Docker
# network as `cocktailrecipes-cocktail:3000` (a network alias unique to this app,
# so it cannot clash with another stack's `cocktail` service), and nothing else can.
#
# COCKTAIL_IMAGE (optional) names the image to run, e.g. a released
# ghcr.io/<owner>/cocktailrecipes@sha256:<digest>; with it set, run
# `docker compose -f compose.prod.yaml up -d --no-build` (the server pulls, never builds).

# Its own project name, so this stack never shares containers or the data
# volume with the local docker-compose.yml in the same checkout.
name: cocktail-prod

services:
  cocktail:
    build: .
    image: ${COCKTAIL_IMAGE:-cocktail:latest}
    # Must exceed SHUTDOWN_FORCE_MS (8000 ms) so the app force timer fires before SIGKILL.
    stop_grace_period: 10s
    env_file: ${COCKTAIL_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATA_DIR: /data
      # Proxies in front of the app. No default: set it in .env. 1 = Caddy
      # alone, receiving visitors directly; 2 = a CDN (e.g. Cloudflare) in
      # front of Caddy. See docs/deploy.md.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:?set TRUST_PROXY_HOPS in .env (1 behind Caddy, 2 behind Cloudflare and Caddy)}
    volumes:
      - cocktail-db:/data
    networks:
      caddy:
        aliases:
          - cocktailrecipes-cocktail
    # A tiny init as PID 1 forwards `docker stop` to Node, so the container
    # stops at once instead of being killed after 10 s.
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 1.0
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    restart: unless-stopped

networks:
  caddy:
    external: true
    name: ${CADDY_NETWORK:-caddy}

volumes:
  cocktail-db:
    # A fixed name, so the backup commands in docs/deploy.md always find it.
    name: cocktail-prod-db
