name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unused files, exports and dependencies
        run: npm run knip

      - name: Test (enforces coverage thresholds)
        run: npm run test:coverage

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Builds the production bundle and serves it from Express, the same
      # shape as the Docker image, then drives it in a real browser.
      - name: Run browser tests
        run: npm run e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Plain `docker build` on the runner's preinstalled Docker: no action
      # inputs, no Buildx driver to configure, no remote cache backend. This
      # exact command is what the image is verified with locally.
      - name: Build image
        run: docker build --progress=plain -t cocktail:ci .

      - name: Smoke-test the container
        run: |
          docker run -d --name cocktail -p 3000:3000 cocktail:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then
              echo "container is healthy"
              curl -fsS http://localhost:3000/api/recipes > /dev/null
              docker rm -f cocktail
              exit 0
            fi
            sleep 2
          done
          echo "::error::server did not become healthy in time"
          docker logs cocktail
          exit 1
