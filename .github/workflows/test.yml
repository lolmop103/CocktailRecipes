# agent-kit ci-block: check/workflow-test v1
name: test

on:
  workflow_call:
    inputs:
      api:
        description: Run the API checks
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # agent-kit ci-block: check/node-pnpm v2
  api:
    if: inputs.api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    # project: begin
    timeout-minutes: 25
    # project: end
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ./package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ./package.json
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml
      - name: Install Safe Chain
        run: |
          curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.26/install-safe-chain.sh -o /tmp/install-safe-chain.sh
          echo "9e4af7107f06d9c0d758cb08fb36804c2af88e24972f3a9d3f8c2bd0ca002adf  /tmp/install-safe-chain.sh" | sha256sum -c -
          sh /tmp/install-safe-chain.sh --ci
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm knip
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      # Builds the production bundle and serves it from Express, the same
      # shape as the Docker image, then drives it in a real browser.
      - run: pnpm e2e
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
